<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingresar · Seguimiento de Requerimientos</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1b2430;
    --ink-soft:#5b6472;
    --line:#e3e6ea;
    --accent:#2f5d50;
    --accent-soft:#e7efec;
    --bg:#f4f5f7;
  }
  *{font-family:'Inter',sans-serif;}
  body{
    background:var(--bg);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--ink);
  }
  .login-wrap{
    width:100%;
    max-width:380px;
    padding:2rem;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:.6rem;
    margin-bottom:2rem;
  }
  .brand-mark{
    width:36px;height:36px;border-radius:9px;
    background:var(--accent);
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:1rem;
  }
  .brand-name{font-weight:600;font-size:1.05rem;letter-spacing:-0.01em;}
  .card-login{
    background:#fff;
    border:1px solid var(--line);
    border-radius:14px;
    padding:2rem;
  }
  .card-login h1{
    font-size:1.3rem;
    font-weight:600;
    margin-bottom:.25rem;
    letter-spacing:-0.01em;
  }
  .card-login p.subtitle{
    color:var(--ink-soft);
    font-size:.9rem;
    margin-bottom:1.5rem;
  }
  label{font-size:.85rem;font-weight:500;color:var(--ink);margin-bottom:.3rem;}
  .form-control{
    border-radius:9px;
    border:1px solid var(--line);
    padding:.6rem .75rem;
    font-size:.92rem;
  }
  .form-control:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-soft);
  }
  .btn-login{
    background:var(--accent);
    border:none;
    color:#fff;
    border-radius:9px;
    padding:.65rem;
    font-weight:600;
    font-size:.92rem;
    width:100%;
  }
  .btn-login:hover{background:#254b41;color:#fff;}
  .btn-login:disabled{opacity:.6;}
  #errorMsg{
    display:none;
    font-size:.85rem;
    color:#a13636;
    background:#fbeaea;
    border-radius:8px;
    padding:.5rem .75rem;
    margin-bottom:1rem;
  }
</style>
</head>
<body>
  <div class="login-wrap">
    <div class="brand">
      <div class="brand-mark">SR</div>
      <div class="brand-name">Seguimiento de Requerimientos</div>
    </div>
    <div class="card-login">
      <h1>Iniciar sesión</h1>
      <p class="subtitle">Ingresa con tu usuario para ver y gestionar los requerimientos.</p>
      <div id="errorMsg"></div>
      <form id="loginForm">
        <div class="mb-3">
          <label for="usuario">Usuario</label>
          <input type="text" class="form-control" id="usuario" autocomplete="username" required>
        </div>
        <div class="mb-3">
          <label for="password">Contraseña</label>
          <input type="password" class="form-control" id="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn-login" id="btnLogin">Ingresar</button>
      </form>
    </div>
  </div>

<script src="config.js"></script>
<script>
  // Si ya hay sesión activa, saltar directo al dashboard
  if (localStorage.getItem('sr_usuario')) {
    window.location.href = 'index.html';
  }

  document.getElementById('loginForm').addEventListener('submit', async function(e){
    e.preventDefault();
    const usuario = document.getElementById('usuario').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('btnLogin');
    const errorMsg = document.getElementById('errorMsg');
    errorMsg.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Ingresando...';

    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'login', usuario, password })
      });
      const data = await res.json();
      if (data.status === 'success') {
        localStorage.setItem('sr_usuario', data.usuario);
        localStorage.setItem('sr_nombre', data.nombre);
        localStorage.setItem('sr_rol', data.rol);
        window.location.href = 'index.html';
      } else {
        errorMsg.textContent = data.message || 'No se pudo iniciar sesión';
        errorMsg.style.display = 'block';
      }
    } catch (err) {
      errorMsg.textContent = 'Error de conexión. Verifica la URL del backend en config.js.';
      errorMsg.style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Ingresar';
    }
  });
</script>
</body>
</html>
