<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bots de Chatfuel | Nexus</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">

    <style>
    /* ===== NX-UI: estilos compartidos de Campañas y Bots (mantener iguales en ambas páginas) ===== */
    html { font-size: 14px; }
    :root {
        --bg-color: #F4F7FE;
        --glass-bg: rgba(255, 255, 255, 0.72);
        --text-main: #2B3674;
        --text-muted: #707EAE;
        --text-soft: #A3AED0;
        --accent-blue: #4318FF;
        --accent-blue-dark: #3311DB;
        --accent-green: #05CD99;
        --accent-orange: #FFB547;
        --danger: #E53E3E;
        --border-color: #E2E8F0;
        --shadow-md: 0 18px 40px rgba(112, 144, 176, 0.10);
        --shadow-lg: 0 25px 50px rgba(112, 144, 176, 0.20);
    }
    body {
        font-family: 'Plus Jakarta Sans', sans-serif; color: var(--text-main); min-height: 100vh;
        background: radial-gradient(circle at 12% 8%, rgba(67,24,255,0.06), transparent 40%), radial-gradient(circle at 90% 92%, rgba(5,205,153,0.06), transparent 40%), var(--bg-color);
        background-attachment: fixed;
        -webkit-font-smoothing: antialiased;
    }
    *:focus-visible { outline: 2px solid var(--accent-blue); outline-offset: 2px; }
    .form-control:focus-visible, .form-select:focus-visible, .glass-input:focus-visible { outline: none; }

    /* Paneles */
    .glass-panel { background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.85); border-radius: 20px; box-shadow: var(--shadow-md); }
    .glass-modal { background: rgba(255,255,255,0.98); border-radius: 20px; box-shadow: var(--shadow-lg); }
    @media (max-width: 767.98px) { .modal-fullscreen-md-down .glass-modal { border-radius: 0; } }
    .modal-backdrop.show { opacity: 1; background: rgba(27, 37, 75, 0.45); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
    .modal .btn-close { opacity: .6; transition: .2s; border-radius: 50%; padding: 10px; }
    .modal .btn-close:hover { opacity: 1; background-color: #f1f5f9; }

    .kpi-icon-wrapper { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; flex-shrink: 0; }
    .icon-blue { background: rgba(67,24,255,0.1); color: var(--accent-blue); }
    .section-title { font-size: 0.7rem; letter-spacing: 1px; color: var(--text-muted); text-transform: uppercase; font-weight: 800; margin-bottom: 0.5rem; }
    .view-card { border: 1px solid var(--border-color); border-radius: 10px; padding: 10px 14px; background: #fff; margin-bottom: 10px; }

    /* Encabezado fijo */
    .nx-header { position: sticky; top: 8px; z-index: 100; display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 8px 12px 0; padding: 12px 20px; }
    @media (min-width: 768px) { .nx-header { margin: 16px 16px 0; top: 12px; padding: 14px 24px; } }
    .nx-brand { display: flex; align-items: center; gap: 14px; min-width: 0; text-decoration: none; color: inherit; }
    .nx-brand-text { min-width: 0; line-height: 1.15; }
    .nx-brand-title { display: block; font-size: 1.35rem; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .nx-brand-sub { display: block; font-size: 0.8rem; font-weight: 500; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    @media (max-width: 575.98px) {
        .nx-header { padding: 10px 14px; gap: 8px; }
        .nx-header .kpi-icon-wrapper { width: 40px; height: 40px; font-size: 1.05rem; }
        .nx-brand { gap: 10px; }
        .nx-brand-title { font-size: 1.1rem; }
        .nx-brand-sub { font-size: 0.72rem; }
    }
    .nx-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .nx-user { display: flex; align-items: center; gap: 10px; padding-right: 6px; }
    .nx-avatar { width: 36px; height: 36px; border-radius: 50%; background: rgba(67,24,255,0.1); color: var(--accent-blue); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 0.9rem; }
    .nx-user-text { line-height: 1.15; text-align: right; }
    .nx-user-name { display: block; font-weight: 700; font-size: 0.85rem; }
    .nx-user-rol { font-size: 0.65rem; font-weight: 700; color: var(--accent-blue); letter-spacing: .4px; }

    /* Botones */
    .btn-primary-custom { background: var(--accent-blue); color: #fff; font-weight: 700; border-radius: 10px; padding: 10px 20px; border: none; font-size: 0.9rem; transition: background .2s, transform .15s, box-shadow .2s; box-shadow: 0 6px 16px rgba(67,24,255,0.22); display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-primary-custom:hover { background: var(--accent-blue-dark); color: #fff; transform: translateY(-1px); box-shadow: 0 10px 22px rgba(67,24,255,0.30); }
    .btn-primary-custom:active { transform: translateY(0); box-shadow: 0 4px 10px rgba(67,24,255,0.25); }
    .btn-soft { background: #fff; border: 1px solid var(--border-color); color: var(--text-main); font-weight: 600; border-radius: 10px; padding: 9px 14px; font-size: 0.85rem; transition: .2s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-soft:hover { border-color: var(--accent-blue); color: var(--accent-blue); background: #fbfaff; transform: translateY(-1px); }
    .btn-soft:active { transform: translateY(0); }
    .btn-soft.danger:hover { border-color: var(--danger); color: var(--danger); background: #fff8f8; }
    .btn-soft.sm { padding: 6px 12px; font-size: 0.78rem; border-radius: 8px; }
    .btn-soft i, .btn-primary-custom i { font-size: .95em; }
    .btn-ok { background: var(--accent-green); color: #fff; border: 0; font-weight: 700; border-radius: 10px; padding: 10px 22px; transition: .2s; box-shadow: 0 6px 16px rgba(5,205,153,0.25); }
    .btn-ok:hover { background: #04b88a; color: #fff; transform: translateY(-1px); }
    .btn-warn { background: #FFF4DF; color: #B7791F; border: 1px solid #FFE2AA; font-weight: 700; border-radius: 10px; padding: 9px 16px; transition: .2s; }
    .btn-warn:hover { background: #FFE9BF; color: #8F5F14; transform: translateY(-1px); }
    .btn-ghost-text { background: transparent; border: 0; color: var(--text-muted); font-weight: 700; border-radius: 10px; padding: 10px 16px; transition: .2s; }
    .btn-ghost-text:hover { color: var(--text-main); background: #eef2f7; }

    /* Botón flotante (móvil) */
    .nx-fab { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 90; width: 56px; height: 56px; border-radius: 50%; border: 0; background: var(--accent-blue); color: #fff; font-size: 1.3rem; box-shadow: 0 12px 28px rgba(67,24,255,0.40); display: none; align-items: center; justify-content: center; transition: .2s; }
    .nx-fab:hover { background: var(--accent-blue-dark); transform: scale(1.06); }
    .nx-fab:active { transform: scale(.96); }
    @media (max-width: 575.98px) { .nx-fab.nx-fab-on { display: flex; } .nx-btn-nuevo { display: none !important; } }

    /* Campos */
    .form-label { font-size: 0.75rem; font-weight: 700; color: var(--text-muted); margin-bottom: 4px; }
    .glass-input { background: #fff !important; border: 1px solid var(--border-color) !important; border-radius: 10px; padding: 9px 12px; font-size: 0.88rem; font-weight: 500; color: var(--text-main); box-shadow: none !important; transition: border-color .2s, box-shadow .2s; }
    .glass-input::placeholder { color: var(--text-soft); font-weight: 400; }
    .glass-input:hover { border-color: #cbd5e1 !important; }
    .glass-input:focus { border-color: var(--accent-blue) !important; box-shadow: 0 0 0 4px rgba(67,24,255,0.10) !important; }
    .glass-input:disabled { background: #f8fafc !important; color: var(--text-muted); }
    .nx-search { position: relative; flex: 1 1 260px; max-width: 420px; }
    .nx-search i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-soft); pointer-events: none; font-size: .9rem; }
    .nx-search input { padding-left: 38px; padding-top: 10px; padding-bottom: 10px; font-size: 0.92rem; width: 100%; }
    @media (max-width: 575.98px) { .nx-search { max-width: none; flex-basis: 100%; } }
    .nx-count { font-size: 0.85rem; font-weight: 700; padding: 8px 16px; border-radius: 999px; background: #fff; border: 1px solid var(--border-color); color: var(--text-main); white-space: nowrap; }
    .form-select.glass-input { padding-right: 2.2rem; }

    /* Chips con desplazamiento horizontal en móvil */
    .nx-chip-line { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; min-width: 0; }
    .nx-chip-label { font-size: 0.68rem; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); flex-shrink: 0; width: 52px; }
    .nx-chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px 2px 4px; flex: 1; min-width: 0; -webkit-overflow-scrolling: touch; }
    .nx-chips::-webkit-scrollbar { display: none; }
    .brand-chip { background: #fff; border: 1px solid var(--border-color); color: var(--text-muted); font-weight: 600; font-size: 0.8rem; padding: 7px 16px; border-radius: 999px; cursor: pointer; transition: .2s; white-space: nowrap; flex-shrink: 0; }
    .brand-chip:hover { border-color: var(--accent-blue); color: var(--accent-blue); transform: translateY(-1px); }
    .brand-chip.active { background: var(--accent-blue); border-color: var(--accent-blue); color: #fff; box-shadow: 0 6px 14px rgba(67,24,255,0.22); }
    @media (max-width: 575.98px) { .nx-chip-label { display: none; } }

    /* Pestañas */
    .custom-tabs-container { display: flex; width: fit-content; max-width: 100%; overflow-x: auto; background: #f8fafc; border: 1px solid var(--border-color); border-radius: 12px; padding: 4px; scrollbar-width: none; }
    .custom-tabs-container::-webkit-scrollbar { display: none; }
    .custom-tabs-container .nav-link { white-space: nowrap; color: var(--text-muted); font-size: 0.85rem; font-weight: 600; border-radius: 9px; padding: 7px 16px; margin: 0 2px; transition: .2s; }
    .custom-tabs-container .nav-link:hover { color: var(--accent-blue); }
    .custom-tabs-container .nav-link.active { background: #fff; color: var(--accent-blue); box-shadow: 0 2px 6px rgba(0,0,0,0.06); border: 1px solid var(--border-color); }
    @media (max-width: 575.98px) { .custom-tabs-container { width: 100%; } .custom-tabs-container .nav-link { padding: 7px 12px; font-size: 0.8rem; } }

    /* Estados vacíos, carga y esqueletos */
    .nx-empty { text-align: center; padding: 56px 20px; color: var(--text-muted); }
    .nx-empty .nx-empty-icon { width: 76px; height: 76px; border-radius: 50%; background: rgba(67,24,255,0.08); color: var(--accent-blue); display: inline-flex; align-items: center; justify-content: center; font-size: 1.9rem; margin-bottom: 16px; }
    .nx-empty h5 { color: var(--text-main); font-weight: 800; margin-bottom: 6px; }
    .nx-empty p { max-width: 360px; margin: 0 auto 18px; font-size: .9rem; }
    .nx-skel { border-radius: 20px; min-height: 190px; background: linear-gradient(100deg, rgba(255,255,255,.55) 30%, rgba(255,255,255,.95) 50%, rgba(255,255,255,.55) 70%) #eef2f9; background-size: 300% 100%; animation: nx-shimmer 1.3s infinite linear; border: 1px solid rgba(255,255,255,.8); }
    @keyframes nx-shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }
    #loaderOverlay { position: fixed; inset: 0; background: rgba(244,247,254,0.72); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; text-align: center; }
    #loaderOverlay .nx-loader-card { background: #fff; border-radius: 20px; box-shadow: var(--shadow-lg); padding: 26px 34px; display: flex; flex-direction: column; align-items: center; max-width: 90vw; }
    #loaderOverlay h5 { margin: 14px 0 0; font-size: 0.95rem; font-weight: 700; color: var(--text-main); }

    /* ===== SweetAlert con el diseño de Nexus ===== */
    .swal2-container.nx-swal-container { background: rgba(27, 37, 75, 0.45) !important; backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); padding: 16px; }
    .swal2-popup.nx-swal { font-family: 'Plus Jakarta Sans', sans-serif; width: 30em; max-width: 100%; border-radius: 22px; padding: 1.8rem 1.5rem 1.5rem; background: #fff; box-shadow: var(--shadow-lg); border: 1px solid rgba(255,255,255,0.9); }
    .nx-swal-title.swal2-title { font-size: 1.3rem; font-weight: 800; color: var(--text-main); padding: .2rem 0 0; }
    .nx-swal-text.swal2-html-container { font-size: 0.92rem; line-height: 1.55; color: var(--text-muted); margin: .6rem 0 0; padding: 0 .4rem; }
    .nx-swal-text b, .nx-swal-text strong { color: var(--text-main); }
    .nx-swal-actions.swal2-actions { gap: 10px; margin-top: 1.4rem; width: 100%; }
    .nx-btn { border: 0; border-radius: 10px; padding: 11px 24px; font-weight: 700; font-size: 0.9rem; font-family: inherit; cursor: pointer; transition: background .2s, transform .15s, box-shadow .2s; }
    .nx-btn-primary { background: var(--accent-blue); color: #fff; box-shadow: 0 6px 16px rgba(67,24,255,0.25); }
    .nx-btn-primary:hover { background: var(--accent-blue-dark); transform: translateY(-1px); }
    .nx-btn-danger { background: var(--danger); color: #fff; box-shadow: 0 6px 16px rgba(229,62,62,0.25); }
    .nx-btn-danger:hover { background: #c53030; transform: translateY(-1px); }
    .nx-btn-ghost { background: #eef2f7; color: var(--text-muted); }
    .nx-btn-ghost:hover { background: #e2e8f0; color: var(--text-main); }
    .nx-btn:focus-visible { outline: 2px solid var(--accent-blue); outline-offset: 2px; }
    @media (max-width: 480px) { .nx-swal-actions.swal2-actions { flex-direction: column-reverse; } .nx-btn { width: 100%; } }
    .swal2-icon { margin: 1rem auto .6rem; }
    .swal2-icon.swal2-success { border-color: rgba(5,205,153,0.30); color: var(--accent-green); }
    .swal2-icon.swal2-success [class^=swal2-success-line] { background-color: var(--accent-green); }
    .swal2-icon.swal2-success .swal2-success-ring { border-color: rgba(5,205,153,0.25); }
    .swal2-icon.swal2-error { border-color: rgba(229,62,62,0.35); color: var(--danger); }
    .swal2-icon.swal2-error [class^=swal2-x-mark-line] { background-color: var(--danger); }
    .swal2-icon.swal2-warning { border-color: rgba(255,181,71,0.5); color: var(--accent-orange); }
    .swal2-icon.swal2-question, .swal2-icon.swal2-info { border-color: rgba(67,24,255,0.28); color: var(--accent-blue); }
    .swal2-timer-progress-bar { background: rgba(67,24,255,0.35); }
    /* avisos rápidos (toast) */
    .swal2-popup.nx-toast { font-family: 'Plus Jakarta Sans', sans-serif; border-radius: 14px; padding: .75rem 1rem; box-shadow: var(--shadow-lg); border: 1px solid var(--border-color); max-width: calc(100vw - 24px); }
    .nx-toast .swal2-title { font-size: 0.9rem; font-weight: 700; color: var(--text-main); margin: 0 0 0 .5rem; }
    .nx-toast .swal2-icon { margin: 0; }
    /* contenido que se muestra dentro de los avisos */
    .nx-swal .nx-plan { text-align: left; background: #f8fafc; border: 1px solid var(--border-color); border-radius: 12px; padding: 12px 14px; color: var(--text-main); }

    @media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

    /* ===== Propios de Bots ===== */
    /* el token se oculta sin usar type="password", para que Chrome no ofrezca guardar contraseñas */
    .token-oculto { -webkit-text-security: disc; text-security: disc; }
    .bot-card { position: relative; transition: transform .25s, box-shadow .25s, background .25s; }
    .bot-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); background: #fff; }
    .bot-avatar { width: 46px; height: 46px; border-radius: 14px; background: rgba(67,24,255,0.10); color: var(--accent-blue); display: flex; align-items: center; justify-content: center; font-size: 1.15rem; flex-shrink: 0; }
    .bot-nombre { font-size: 1.05rem; font-weight: 800; line-height: 1.25; margin: 0; word-break: break-word; }
    .bot-dato { background: #f8fafc; border: 1px solid var(--border-color); border-radius: 10px; padding: 8px 10px 8px 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; min-width: 0; }
    .bot-dato .mono { font-family: ui-monospace, Consolas, monospace; font-size: 0.78rem; word-break: break-all; min-width: 0; }
    .copy-btn { border: 1px solid var(--border-color); background: #fff; border-radius: 8px; padding: 4px 9px; color: var(--text-muted); font-size: 0.75rem; cursor: pointer; transition: .2s; flex-shrink: 0; }
    .copy-btn:hover { color: var(--accent-blue); border-color: var(--accent-blue); background: #fbfaff; }
    .uso-pill { font-size: 0.68rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: #eef2f7; color: var(--text-muted); white-space: nowrap; }
    .uso-pill.en-uso { background: rgba(5,205,153,0.14); color: #059669; }
    .btn-soft:disabled { opacity: .45; cursor: not-allowed; transform: none; border-color: var(--border-color); color: var(--text-muted); background: #fff; }
    .glass-input.is-invalid { border-color: var(--danger) !important; box-shadow: 0 0 0 4px rgba(229,62,62,0.10) !important; background-image: none; }
    .input-token { position: relative; }
    .input-token .glass-input { padding-right: 46px; }
    .input-token .ojo { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: 0; background: transparent; color: var(--text-muted); width: 34px; height: 34px; border-radius: 8px; transition: .2s; }
    .input-token .ojo:hover { background: #eef2f7; color: var(--accent-blue); }
    </style>
</head>
<body>
    <div id="loaderOverlay" style="display:none;" role="status" aria-live="polite">
        <div class="nx-loader-card">
            <div class="spinner-border text-primary" role="presentation"></div>
            <h5 id="loaderTexto">Cargando bots...</h5>
        </div>
    </div>

    <header class="nx-header glass-panel">
        <a class="nx-brand" href="bots.html">
            <div class="kpi-icon-wrapper icon-blue"><i class="fa-solid fa-robot"></i></div>
            <div class="nx-brand-text"><span class="nx-brand-title">Bots de Chatfuel</span><span class="nx-brand-sub">Se usan en las campañas</span></div>
        </a>
        <div class="nx-actions">
            <div class="nx-user d-none d-sm-flex">
                <div class="nx-user-text"><span class="nx-user-name" id="navUserNombre">--</span><span class="nx-user-rol" id="navUserRol">--</span></div>
                <div class="nx-avatar" id="navAvatar" aria-hidden="true">?</div>
            </div>
            <button class="btn-primary-custom nx-btn-nuevo" onclick="abrirFormulario(null)"><i class="fa-solid fa-plus"></i> Nuevo bot</button>
            <button class="btn-soft" title="Campañas" aria-label="Campañas" onclick="location.href='campanias.html'"><i class="fa-solid fa-bullhorn"></i><span class="d-none d-lg-inline">Campañas</span></button>
            <button class="btn-soft" title="Volver a Nexus" aria-label="Volver a Nexus" onclick="volverANexus()"><i class="fa-solid fa-house"></i><span class="d-none d-lg-inline">Nexus</span></button>
        </div>
    </header>
    <button class="nx-fab nx-fab-on" aria-label="Nuevo bot" title="Nuevo bot" onclick="abrirFormulario(null)"><i class="fa-solid fa-plus"></i></button>

    <main class="container-fluid px-3 px-md-4 px-xl-5 pb-5 mt-3 mt-md-4">
        <div class="d-flex flex-wrap gap-3 align-items-center justify-content-between mb-3 mb-md-4">
            <div class="nx-search">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" class="form-control glass-input" autocomplete="off" data-lpignore="true" data-1p-ignore placeholder="Buscar bot..." aria-label="Buscar bot" oninput="renderGrid()">
            </div>
            <span class="nx-count" id="totalCount">0 Bots</span>
        </div>
        <div class="row g-3 g-md-4" id="botGrid"></div>
    </main>

    <div class="modal fade" id="botModal" tabindex="-1" aria-labelledby="botModalTitulo">
        <div class="modal-dialog modal-dialog-centered modal-fullscreen-sm-down">
            <div class="modal-content glass-modal border-0 shadow-lg">
                <div class="modal-header border-bottom-0 pt-4 px-4 pb-0">
                    <div class="d-flex align-items-center gap-3">
                        <div class="bot-avatar"><i class="fa-solid fa-robot"></i></div>
                        <div>
                            <h5 class="fw-bold m-0" id="botModalTitulo">Nuevo bot</h5>
                            <div class="text-muted" style="font-size:0.78rem;">Un bot por cada número de Chatfuel</div>
                        </div>
                    </div>
                    <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body px-4 pb-4 pt-3">
                    <div class="mb-3">
                        <label class="form-label" for="fAlias">Alias (único)</label>
                        <input type="text" id="fAlias" class="form-control glass-input" autocomplete="off" data-lpignore="true" data-1p-ignore placeholder="ej. neumann">
                        <div class="text-muted mt-1" style="font-size:0.74rem;" id="fAliasAyuda">Es el nombre interno con el que las campañas se conectan al bot. Después no se puede cambiar.</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="fNombre">Nombre visible</label>
                        <input type="text" id="fNombre" class="form-control glass-input" autocomplete="off" data-lpignore="true" data-1p-ignore placeholder="ej. Neumann - WhatsApp principal">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="fBotId">Bot ID de Chatfuel</label>
                        <input type="text" id="fBotId" class="form-control glass-input" autocomplete="off" data-lpignore="true" data-1p-ignore placeholder="ej. 661379e7...">
                    </div>
                    <div class="mb-4">
                        <label class="form-label" for="fToken">Token de Chatfuel</label>
                        <div class="input-token">
                            <input type="text" id="fToken" class="form-control glass-input token-oculto" autocomplete="off" autocapitalize="off" spellcheck="false" data-lpignore="true" data-1p-ignore placeholder="chatfuel_token">
                            <button type="button" class="ojo" id="btnOjo" aria-label="Mostrar u ocultar el token" title="Mostrar / ocultar" onclick="alternarToken()"><i class="fa-regular fa-eye"></i></button>
                        </div>
                        <div class="text-muted mt-1" style="font-size:0.74rem;" id="fTokenAyuda"></div>
                    </div>
                    <div class="d-flex flex-column-reverse flex-sm-row justify-content-sm-end gap-2">
                        <button class="btn-ghost-text" data-bs-dismiss="modal">Cancelar</button>
                        <button class="btn-primary-custom" onclick="guardarBot()"><i class="fa-solid fa-floppy-disk"></i> Guardar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
    // ===== NX-UI: avisos con el diseño de Nexus (iguales en Campañas y Bots) =====
    const NX_SWAL_CLASES = {
        container: 'nx-swal-container', popup: 'nx-swal', title: 'nx-swal-title', htmlContainer: 'nx-swal-text',
        actions: 'nx-swal-actions', confirmButton: 'nx-btn nx-btn-primary', cancelButton: 'nx-btn nx-btn-ghost', denyButton: 'nx-btn nx-btn-danger'
    };
    // para acciones que borran algo: el botón de confirmar sale en rojo
    const NX_SWAL_PELIGRO = Object.assign({}, NX_SWAL_CLASES, { confirmButton: 'nx-btn nx-btn-danger' });
    if (window.Swal && window.Swal.mixin) {
        window.Swal = window.Swal.mixin({ buttonsStyling: false, reverseButtons: true, heightAuto: false, customClass: NX_SWAL_CLASES });
    }
    // aviso breve arriba a la derecha, que se cierra solo
    function nxToast(icono, titulo) {
        return Swal.fire({
            toast: true, position: 'top-end', icon: icono, title: titulo, showConfirmButton: false, timer: 2400, timerProgressBar: true,
            customClass: { popup: 'nx-toast' }
        });
    }

    // Misma URL del Apps Script que usa Nexus
    const API_URL = 'https://script.google.com/macros/s/AKfycbwqGCUJN2vpqV_Ie7T66zWTPFGt1XPMoeOl0ERwCzKd7hbBPj1gOX-qeL4qrHs-g6LdfA/exec';
    const NEXUS_URL = 'index.html';
    const SESSION_KEY = 'nexus_session';

    let currentUser = null;
    let bots = [];
    let editando = null;   // alias del bot que se edita (null = nuevo)
    let primeraCarga = true;

    function escapeHtml(str) {
        if (str === null || str === undefined) return '';
        return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function showLoader(mostrar, texto) {
        document.getElementById('loaderOverlay').style.display = mostrar ? 'flex' : 'none';
        document.getElementById('loaderTexto').innerText = texto || 'Cargando bots...';
    }
    function volverANexus() { location.href = NEXUS_URL; }
    function errorSwal(e) { Swal.fire('No se pudo completar', e.message || String(e), 'error'); }

    async function api(action, extra) {
        const response = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(Object.assign({ action: action, usuario: currentUser.usuario, password: currentUser.password }, extra || {}))
        });
        const res = await response.json();
        if (res.sesionInvalida) {
            sessionStorage.removeItem(SESSION_KEY);
            location.href = NEXUS_URL;
            throw new Error('Sesión inválida');
        }
        if (res.status !== 'success') throw new Error(res.message || 'Error del servidor');
        return res;
    }

    document.addEventListener('DOMContentLoaded', () => {
        const saved = sessionStorage.getItem(SESSION_KEY);
        if (!saved) { volverANexus(); return; }
        try { currentUser = JSON.parse(saved); } catch (e) { volverANexus(); return; }
        if (!currentUser || !currentUser.password) { volverANexus(); return; }
        const nombreUsuario = currentUser.nombre || currentUser.usuario || '?';
        document.getElementById('navUserNombre').innerText = nombreUsuario;
        document.getElementById('navUserRol').innerText = currentUser.rol;
        document.getElementById('navAvatar').innerText = String(nombreUsuario).trim().charAt(0).toUpperCase();
        document.getElementById('botGrid').innerHTML = Array.from({ length: 6 }, () =>
            '<div class="col-12 col-md-6 col-xl-4"><div class="nx-skel" aria-hidden="true"></div></div>').join('');
        cargar();
    });

    async function cargar() {
        if (!primeraCarga) showLoader(true);
        try {
            const res = await api('botsListar');
            bots = res.bots;
            renderGrid();
        } catch (e) {
            document.getElementById('botGrid').innerHTML = '';
            errorSwal(e);
        }
        primeraCarga = false;
        showLoader(false);
    }

    function renderGrid() {
        const q = document.getElementById('searchInput').value.toLowerCase().trim();
        const lista = bots.filter(b => !q || (b.alias + ' ' + b.nombre + ' ' + b.botId).toLowerCase().includes(q));
        document.getElementById('totalCount').innerText = lista.length + (lista.length === 1 ? ' Bot' : ' Bots');
        if (lista.length === 0) {
            document.getElementById('botGrid').innerHTML = bots.length
                ? '<div class="col-12"><div class="nx-empty"><div class="nx-empty-icon"><i class="fa-solid fa-magnifying-glass"></i></div><h5>Ningún bot coincide</h5><p>Prueba con otro nombre, alias o Bot ID.</p></div></div>'
                : '<div class="col-12"><div class="nx-empty"><div class="nx-empty-icon"><i class="fa-solid fa-robot"></i></div><h5>Aún no hay bots</h5><p>Agrega el bot de Chatfuel (Bot ID y token) para poder usarlo en tus campañas.</p><button class="btn-primary-custom" onclick="abrirFormulario(null)"><i class="fa-solid fa-plus"></i> Nuevo bot</button></div></div>';
            return;
        }
        document.getElementById('botGrid').innerHTML = lista.map(b => {
            const enUso = b.campanas > 0;
            return `
            <div class="col-12 col-md-6 col-xl-4">
                <div class="glass-panel bot-card p-3 p-md-4 h-100 d-flex flex-column">
                    <div class="d-flex align-items-start gap-3 mb-3">
                        <div class="bot-avatar"><i class="fa-solid fa-robot"></i></div>
                        <div class="flex-grow-1 min-w-0" style="min-width:0;">
                            <h5 class="bot-nombre">${escapeHtml(b.nombre)}</h5>
                            <span class="badge bg-light text-primary border mt-1">${escapeHtml(b.alias)}</span>
                        </div>
                        <span class="uso-pill ${enUso ? 'en-uso' : ''}">${b.campanas} campaña${b.campanas === 1 ? '' : 's'}</span>
                    </div>
                    <div class="section-title mb-1">Bot ID</div>
                    <div class="bot-dato mb-3">
                        <span class="mono">${escapeHtml(b.botId)}</span>
                        <button class="copy-btn" aria-label="Copiar Bot ID" title="Copiar" onclick="copiar(this.dataset.v)" data-v="${escapeHtml(b.botId)}"><i class="fa-regular fa-copy"></i></button>
                    </div>
                    <div class="section-title mb-1">Token</div>
                    <div class="bot-dato mb-4">
                        <span class="mono">${b.tokenParcial ? escapeHtml(b.tokenParcial) : '<span class="text-danger fw-bold">sin token</span>'}</span>
                        <i class="fa-solid fa-lock text-muted" style="font-size:.75rem;" title="El token completo no se muestra"></i>
                    </div>
                    <div class="d-flex gap-2 mt-auto">
                        <button class="btn-soft flex-fill" onclick="abrirFormulario(this.dataset.a)" data-a="${escapeHtml(b.alias)}"><i class="fa-solid fa-pen"></i>Editar</button>
                        <button class="btn-soft danger flex-fill" ${enUso ? 'disabled title="No se puede eliminar: lo usan campañas"' : ''} onclick="eliminarBot(this.dataset.a)" data-a="${escapeHtml(b.alias)}"><i class="fa-solid fa-trash"></i>Eliminar</button>
                    </div>
                </div>
            </div>`;
        }).join('');
    }

    function copiar(texto) {
        navigator.clipboard.writeText(texto).then(() => nxToast('success', 'Bot ID copiado'), () => nxToast('error', 'No se pudo copiar'));
    }

    function alternarToken() {
        const campo = document.getElementById('fToken');
        const oculto = campo.classList.toggle('token-oculto');
        document.querySelector('#btnOjo i').className = oculto ? 'fa-regular fa-eye' : 'fa-regular fa-eye-slash';
    }

    function abrirFormulario(alias) {
        editando = alias;
        const b = alias ? bots.find(x => x.alias === alias) : null;
        document.getElementById('botModalTitulo').innerText = b ? 'Editar bot' : 'Nuevo bot';
        document.getElementById('fAlias').value = b ? b.alias : '';
        document.getElementById('fAlias').disabled = !!b;
        document.getElementById('fAliasAyuda').style.display = b ? 'none' : 'block';
        document.getElementById('fNombre').value = b ? b.nombre : '';
        document.getElementById('fBotId').value = b ? b.botId : '';
        document.getElementById('fToken').value = '';
        document.getElementById('fToken').classList.add('token-oculto');
        document.querySelector('#btnOjo i').className = 'fa-regular fa-eye';
        document.getElementById('fTokenAyuda').innerText = b ? 'Déjalo vacío para conservar el token actual (' + (b.tokenParcial || 'sin token') + ').' : '';
        ['fAlias', 'fNombre', 'fBotId', 'fToken'].forEach(id => document.getElementById(id).classList.remove('is-invalid'));
        bootstrap.Modal.getOrCreateInstance(document.getElementById('botModal')).show();
    }

    async function guardarBot() {
        const datos = {
            alias: document.getElementById('fAlias').value.trim(),
            nombre: document.getElementById('fNombre').value.trim(),
            botId: document.getElementById('fBotId').value.trim(),
            token: document.getElementById('fToken').value.trim()
        };
        // se marcan en rojo los campos que faltan
        const obligatorios = { fAlias: datos.alias, fNombre: datos.nombre, fBotId: datos.botId };
        if (editando === null) obligatorios.fToken = datos.token;
        let primero = null;
        ['fAlias', 'fNombre', 'fBotId', 'fToken'].forEach(id => {
            const falta = id in obligatorios && !obligatorios[id];
            document.getElementById(id).classList.toggle('is-invalid', falta);
            if (falta && !primero) primero = id;
        });
        if (primero) { document.getElementById(primero).focus(); return; }

        showLoader(true, 'Guardando bot...');
        try {
            await api('botsGuardar', { editar: editando !== null, data: datos });
            bootstrap.Modal.getInstance(document.getElementById('botModal')).hide();
            await cargar();
            nxToast('success', 'Bot guardado');
        } catch (e) { showLoader(false); errorSwal(e); }
    }

    async function eliminarBot(alias) {
        const r = await Swal.fire({
            title: '¿Eliminar el bot "' + alias + '"?', text: 'Esta acción no se puede deshacer. Solo se puede eliminar si ninguna campaña lo usa.',
            icon: 'warning', showCancelButton: true, confirmButtonText: 'Sí, eliminar', cancelButtonText: 'Cancelar',
            customClass: NX_SWAL_PELIGRO
        });
        if (!r.isConfirmed) return;
        showLoader(true, 'Eliminando...');
        try {
            await api('botsEliminar', { alias: alias });
            await cargar();
            nxToast('success', 'Bot eliminado');
        } catch (e) { showLoader(false); errorSwal(e); }
    }
    </script>
</body>
</html>
