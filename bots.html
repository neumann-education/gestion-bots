<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bots de Chatfuel | Nexus</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <style>
    html { font-size: 14px; }
    :root { --bg-color: #F4F7FE; --glass-bg: rgba(255,255,255,0.65); --text-main: #2B3674; --text-muted: #8F9BBA; --accent-blue: #4318FF; --border-color: #E2E8F0; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; }
    .glass-panel { background: var(--glass-bg); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.8); border-radius: 20px; box-shadow: 0 18px 40px rgba(112,144,176,0.08); }
    .glass-modal { background: rgba(255,255,255,0.98); border-radius: 20px; box-shadow: 0 25px 50px rgba(0,0,0,0.1); }
    .kpi-icon-wrapper { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
    .icon-blue { background: rgba(67,24,255,0.1); color: var(--accent-blue); }
    .btn-primary-custom { background: var(--accent-blue); color: white; font-weight: 600; border-radius: 10px; padding: 10px 20px; border: none; font-size: 0.9rem; }
    .btn-primary-custom:hover { color: white; opacity: 0.92; }
    .glass-input { background: #fff !important; border: 1px solid var(--border-color) !important; border-radius: 8px; padding: 8px 12px; font-size: 0.85rem; font-weight: 500; box-shadow: none !important; }
    .glass-input:focus { border-color: var(--accent-blue) !important; }
    .section-title { font-size: 0.7rem; letter-spacing: 1px; color: var(--text-muted); text-transform: uppercase; font-weight: 800; margin-bottom: 0.4rem; }
    /* se oculta el token sin usar type="password", para que Chrome no ofrezca guardar contraseñas */
    .token-oculto { -webkit-text-security: disc; text-security: disc; }
    .bot-card { transition: all 0.3s; }
    .bot-card:hover { transform: translateY(-4px); background: white; box-shadow: 0 25px 50px rgba(112,144,176,0.15); }
    .mono { font-family: ui-monospace, Consolas, monospace; font-size: 0.78rem; word-break: break-all; }
    #loaderOverlay { position: fixed; inset: 0; background: rgba(255,255,255,0.9); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; }
    </style>
</head>
<body>
    <div id="loaderOverlay" style="display:none;">
        <div class="spinner-border text-primary" role="status"></div>
        <h5 class="mt-3 fw-bold text-primary" id="loaderTexto">Cargando bots...</h5>
    </div>

    <nav class="navbar glass-panel d-flex justify-content-between align-items-center shadow-sm m-2 m-md-3 px-3 px-md-4 py-3">
        <a class="navbar-brand fs-4 m-0 d-flex align-items-center" href="#">
            <div class="kpi-icon-wrapper icon-blue me-3"><i class="fa-solid fa-robot"></i></div>
            <div><span class="fw-bold">Bots de Chatfuel</span><span class="fw-medium fs-6 d-block text-muted" style="line-height: 0.8;">Se usan en las campañas</span></div>
        </a>
        <div class="d-flex align-items-center gap-2 gap-md-3">
            <span class="text-end d-none d-sm-block">
                <span class="fw-bold d-block" style="font-size:0.85rem; line-height:1;" id="navUserNombre">--</span>
                <span class="badge bg-light text-primary border" style="font-size:0.65rem;" id="navUserRol">--</span>
            </span>
            <button class="btn btn-primary-custom" onclick="abrirFormulario(null)"><i class="fa-solid fa-plus d-md-inline d-none me-2"></i> Nuevo bot</button>
            <button class="btn btn-light border" title="Campañas" onclick="location.href='campanias.html'"><i class="fa-solid fa-bullhorn text-primary"></i><span class="d-none d-md-inline ms-2">Campañas</span></button>
            <button class="btn btn-light border" title="Volver a Nexus" onclick="volverANexus()"><i class="fa-solid fa-house text-primary"></i><span class="d-none d-md-inline ms-2">Nexus</span></button>
        </div>
    </nav>

    <main class="container-fluid px-3 px-md-5 pb-5 mt-4">
        <div class="glass-panel p-3 mb-4 d-flex flex-wrap gap-3 align-items-center justify-content-between">
            <input type="text" id="searchInput" class="form-control glass-input" autocomplete="off" data-lpignore="true" data-1p-ignore style="max-width: 300px; width: 100%; padding: 10px 15px; font-size: 0.95rem;" placeholder="Buscar bot..." onkeyup="renderGrid()">
            <span class="badge bg-light text-dark border px-3 py-2 fs-6 rounded-pill" id="totalCount">0 Bots</span>
        </div>
        <div class="row g-4" id="botGrid"></div>
    </main>

    <div class="modal fade" id="botModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content glass-modal border-0 shadow-lg">
                <div class="modal-header border-bottom-0 pt-4 px-4">
                    <h5 class="fw-bold m-0" id="botModalTitulo">Nuevo bot</h5>
                    <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body px-4 pb-4">
                    <div class="mb-3">
                        <div class="section-title">Alias (único)</div>
                        <input type="text" id="fAlias" class="form-control glass-input" autocomplete="off" data-lpignore="true" data-1p-ignore placeholder="ej. neumann">
                        <div class="text-muted mt-1" style="font-size:0.72rem;" id="fAliasAyuda">Es el nombre interno con el que las campañas se conectan al bot. Después no se puede cambiar.</div>
                    </div>
                    <div class="mb-3">
                        <div class="section-title">Nombre visible</div>
                        <input type="text" id="fNombre" class="form-control glass-input" autocomplete="off" data-lpignore="true" data-1p-ignore placeholder="ej. Neumann - WhatsApp principal">
                    </div>
                    <div class="mb-3">
                        <div class="section-title">Bot ID de Chatfuel</div>
                        <input type="text" id="fBotId" class="form-control glass-input" autocomplete="off" data-lpignore="true" data-1p-ignore placeholder="ej. 661379e7...">
                    </div>
                    <div class="mb-4">
                        <div class="section-title">Token de Chatfuel</div>
                        <input type="text" id="fToken" class="form-control glass-input token-oculto" autocomplete="off" autocapitalize="off" spellcheck="false" data-lpignore="true" data-1p-ignore placeholder="chatfuel_token">
                        <div class="text-muted mt-1" style="font-size:0.72rem;" id="fTokenAyuda"></div>
                    </div>
                    <div class="d-flex justify-content-end gap-2">
                        <button class="btn btn-light border" data-bs-dismiss="modal">Cancelar</button>
                        <button class="btn btn-primary-custom" onclick="guardarBot()"><i class="fa-solid fa-floppy-disk me-2"></i>Guardar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
    // Misma URL del Apps Script que usa Nexus
    const API_URL = 'https://script.google.com/macros/s/AKfycbwqGCUJN2vpqV_Ie7T66zWTPFGt1XPMoeOl0ERwCzKd7hbBPj1gOX-qeL4qrHs-g6LdfA/exec';
    const NEXUS_URL = 'index.html';
    const SESSION_KEY = 'nexus_session';

    let currentUser = null;
    let bots = [];
    let editando = null;   // alias del bot que se edita (null = nuevo)

    function escapeHtml(str) {
        if (str === null || str === undefined) return '';
        return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function showLoader(mostrar, texto) {
        document.getElementById('loaderOverlay').style.display = mostrar ? 'flex' : 'none';
        document.getElementById('loaderTexto').innerText = texto || 'Cargando bots...';
    }
    function volverANexus() { location.href = NEXUS_URL; }
    function errorSwal(e) { Swal.fire('No se pudo completar', e.message || String(e), 'error'); }

    async function api(action, extra) {
        const response = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(Object.assign({ action: action, usuario: currentUser.usuario, password: currentUser.password }, extra || {}))
        });
        const res = await response.json();
        if (res.sesionInvalida) {
            sessionStorage.removeItem(SESSION_KEY);
            location.href = NEXUS_URL;
            throw new Error('Sesión inválida');
        }
        if (res.status !== 'success') throw new Error(res.message || 'Error del servidor');
        return res;
    }

    document.addEventListener('DOMContentLoaded', () => {
        const saved = sessionStorage.getItem(SESSION_KEY);
        if (!saved) { volverANexus(); return; }
        try { currentUser = JSON.parse(saved); } catch (e) { volverANexus(); return; }
        if (!currentUser || !currentUser.password) { volverANexus(); return; }
        document.getElementById('navUserNombre').innerText = currentUser.nombre || currentUser.usuario;
        document.getElementById('navUserRol').innerText = currentUser.rol;
        cargar();
    });

    async function cargar() {
        showLoader(true);
        try {
            const res = await api('botsListar');
            bots = res.bots;
            renderGrid();
        } catch (e) { errorSwal(e); }
        showLoader(false);
    }

    function renderGrid() {
        const q = document.getElementById('searchInput').value.toLowerCase().trim();
        const lista = bots.filter(b => !q || (b.alias + ' ' + b.nombre + ' ' + b.botId).toLowerCase().includes(q));
        document.getElementById('totalCount').innerText = lista.length + (lista.length === 1 ? ' Bot' : ' Bots');
        if (lista.length === 0) {
            document.getElementById('botGrid').innerHTML = '<div class="col-12 text-center text-muted py-5">No hay bots. Crea el primero con "Nuevo bot".</div>';
            return;
        }
        document.getElementById('botGrid').innerHTML = lista.map(b => `
            <div class="col-12 col-md-6 col-xl-4">
                <div class="glass-panel bot-card p-4 h-100">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <div>
                            <span class="badge bg-light text-primary border mb-2">${escapeHtml(b.alias)}</span>
                            <h5 class="fw-bold mb-0">${escapeHtml(b.nombre)}</h5>
                        </div>
                        <span class="badge bg-light text-dark border">${b.campanas} campaña${b.campanas === 1 ? '' : 's'}</span>
                    </div>
                    <div class="section-title mt-3">Bot ID</div>
                    <div class="mono mb-2">${escapeHtml(b.botId)}</div>
                    <div class="section-title">Token</div>
                    <div class="mono mb-3">${b.tokenParcial ? escapeHtml(b.tokenParcial) : '<span class="text-danger">sin token</span>'}</div>
                    <div class="d-flex gap-2">
                        <button class="btn btn-sm btn-light border" onclick="abrirFormulario(this.dataset.a)" data-a="${escapeHtml(b.alias)}"><i class="fa-solid fa-pen me-1"></i>Editar</button>
                        <button class="btn btn-sm btn-light border text-danger" onclick="eliminarBot(this.dataset.a)" data-a="${escapeHtml(b.alias)}"><i class="fa-solid fa-trash me-1"></i>Eliminar</button>
                    </div>
                </div>
            </div>`).join('');
    }

    function abrirFormulario(alias) {
        editando = alias;
        const b = alias ? bots.find(x => x.alias === alias) : null;
        document.getElementById('botModalTitulo').innerText = b ? 'Editar bot' : 'Nuevo bot';
        document.getElementById('fAlias').value = b ? b.alias : '';
        document.getElementById('fAlias').disabled = !!b;
        document.getElementById('fAliasAyuda').style.display = b ? 'none' : 'block';
        document.getElementById('fNombre').value = b ? b.nombre : '';
        document.getElementById('fBotId').value = b ? b.botId : '';
        document.getElementById('fToken').value = '';
        document.getElementById('fTokenAyuda').innerText = b ? 'Déjalo vacío para conservar el token actual (' + (b.tokenParcial || 'sin token') + ').' : '';
        bootstrap.Modal.getOrCreateInstance(document.getElementById('botModal')).show();
    }

    async function guardarBot() {
        const datos = {
            alias: document.getElementById('fAlias').value.trim(),
            nombre: document.getElementById('fNombre').value.trim(),
            botId: document.getElementById('fBotId').value.trim(),
            token: document.getElementById('fToken').value.trim()
        };
        showLoader(true, 'Guardando bot...');
        try {
            await api('botsGuardar', { editar: editando !== null, data: datos });
            bootstrap.Modal.getInstance(document.getElementById('botModal')).hide();
            await cargar();
            Swal.fire({ icon: 'success', title: 'Bot guardado', timer: 1400, showConfirmButton: false });
        } catch (e) { showLoader(false); errorSwal(e); }
    }

    async function eliminarBot(alias) {
        const r = await Swal.fire({ title: '¿Eliminar el bot "' + alias + '"?', text: 'Solo se puede si ninguna campaña lo usa.', icon: 'warning', showCancelButton: true, confirmButtonText: 'Eliminar', cancelButtonText: 'Cancelar' });
        if (!r.isConfirmed) return;
        showLoader(true, 'Eliminando...');
        try {
            await api('botsEliminar', { alias: alias });
            await cargar();
        } catch (e) { showLoader(false); errorSwal(e); }
    }
    </script>
</body>
</html>
